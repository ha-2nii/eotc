  <circle cx="238" cy="160" r="4" fill="#F5F0E0"/>
  <circle cx="250" cy="158" r="4" fill="#F5F0E0"/>
  <circle cx="262" cy="160" r="4" fill="#F5F0E0"/>
  <circle cx="275" cy="163" r="4" fill="#F5F0E0"/>

