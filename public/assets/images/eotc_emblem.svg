  <ellipse cx="175" cy="115" rx="16" ry="7" fill="#D4AF37" transform="rotate(-60 175 115)"/>
  <ellipse cx="162" cy="130" rx="16" ry="7" fill="#D4AF37" transform="rotate(-70 162 130)"/>
  <ellipse cx="325" cy="115" rx="16" ry="7" fill="#D4AF37" transform="rotate(60 325 115)"/>
  <ellipse cx="338" cy="130" rx="16" ry="7" fill="#D4AF37" transform="rotate(70 338 130)"/>

